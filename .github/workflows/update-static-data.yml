name: Update static archive data

on:
  schedule:
    - cron: "22 16 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Days to refresh"
        default: "7"

permissions:
  contents: write

concurrency:
  group: static-archive-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python static_data/build.py --recent --days "${{ inputs.days || '7' }}"

      - name: Save refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pages/data pages/feed.xml pages/feeds

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update static archive data"
          git pull --rebase origin main
          git push origin main
